<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan Kevin Devano - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="text-xl font-bold tracking-widest text-gray-800">JKD</a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-500 hover:text-blue-600 transition">Home</a>
                    <a href="hobby.html" class="text-gray-500 hover:text-blue-600 transition">Hobby</a>
                    <a href="gallery.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Gallery</a>
                </div>
                <button id="mobile-menu-btn" class="md:hidden text-gray-500 focus:outline-none">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden bg-white border-t border-gray-100 px-4 pt-2 pb-4 space-y-1 md:hidden">
            <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Home</a>
            <a href="hobby.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Hobby</a>
            <a href="gallery.html" class="block px-3 py-2 rounded-md text-base font-medium text-blue-600 bg-blue-50">Gallery</a>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Photo Gallery</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">A curated collection of my favorite photographs from adventures, travels, and everyday moments.</p>
        </div>

        <div class="mb-6 border-b border-gray-200 pb-4">
            <p class="text-gray-500 font-medium">Showing 4 photos</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-2 gap-6">
            <div class="group relative overflow-hidden rounded-xl shadow-sm bg-gray-200 aspect-[4/3]">
                <img src="meerkat.jpg" alt="Meerkat" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
            </div>
            <div class="group relative overflow-hidden rounded-xl shadow-sm bg-gray-200 aspect-[4/3]">
                <img src="dancer.jpg" alt="Dancer" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
            </div>
            <div class="group relative overflow-hidden rounded-xl shadow-sm bg-gray-200 aspect-[4/3]">
                <img src="cockatoo.jpg" alt="Cockatoo" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
            </div>
            <div class="group relative overflow-hidden rounded-xl shadow-sm bg-gray-200 aspect-[4/3]">
                <img src="dancer2.jpg" alt="Dancer Night" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-500">
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm">
        <p>&copy; 2026 Jonathan Kevin Devano. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
