<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan Kevin Devano - Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="flex items-center"><img src="Foto/Logo.png" alt="Logo" class="h-10 w-auto md:h-12">
                    
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link-idle">Home</a>
                    <a href="hobby.html" class="nav-link-idle">Hobby</a>
                    <a href="gallery.html" class="nav-link-active">Gallery</a>
                </div>
                <button id="mobile-menu-btn" class="md:hidden text-gray-500">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Photo Gallery</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">A curated collection of my favorite photographs from adventures, travels, and everyday moments.</p>
        </div>

        <div class="mb-6 border-b border-gray-200 pb-4">
            <p class="text-gray-500 font-medium">Showing 4 photos</p>
        </div>

        <div class="gallery-grid">
            <div class="image-card">
                <img src="Foto/IMG_20230705_135354.jpg" alt="Meerkat" class="image-zoom">
            </div>
            <div class="image-card">
                <img src="Foto/2022_1203_09334300.jpg" alt="Dancer" class="image-zoom">
            </div>
            <div class="image-card">
                <img src="Foto/IMG_20230705_124952.jpg" alt="Cockatoo" class="image-zoom">
            </div>
            <div class="image-card">
                <img src="Foto/IMG_20230419_141527.jpg" alt="Dancer Night" class="image-zoom">
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm">
        <p>&copy; 2026 Jonathan Kevin Devano. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
